<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Public Sites</title>
<style>
:root{--bg:#0e1220;--panel:#151a2a;--line:#2a3150;--fg:#e9e4d6;--dim:#959bb0;--accent:#d8bf86;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.04em}
p.lead{margin:0 0 28px;color:var(--dim)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a.site{display:block;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none}
a.site:hover,a.site:focus-visible{border-color:var(--accent);outline:none}
a.site b{display:block;font-size:16px}
a.site span{color:var(--dim);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Public Sites</h1>
  <p class="lead">公開しているサイトの一覧です。</p>
  <ul>
    <li><a class="site" href="./rta-overlay-playground/"><b>RTA配信画面 プレイグラウンド</b><span>RTA配信オーバーレイの枠線・シャドウ・配置を組み替えて、OBS用HTMLとして書き出せます。</span></a></li>
  </ul>
</main>
</body>
</html>
